name: tryst-segmented
version: 0.1.0

authors:
  - James Cook

crystal: ">= 1.21.0"

license: MIT

description: |
  An iOS/web-style segmented control for tryst - a rounded pill row of
  mutually exclusive options with a sliding accent highlight, replacing
  a line of ttk radio buttons. Built on Tryst::OwnerDrawnWidget and
  rendered through tryst-vector.

dependencies:
  tryst:
    github: jamescook/tryst
    version: "~> 0.1"
  tryst-vector:
    github: jamescook/tryst-vector
    version: "~> 0.1"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    tag: v1.7.0

# Informational (shards does not install these) - see tryst-vector's own
# shard.yml for the per-platform package names; this shard needs exactly
# what tryst-vector needs, since it renders through the same Surface.
libraries:
  libthorvg: ">= 1.0.0"
